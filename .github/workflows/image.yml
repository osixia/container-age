name: osixia
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/osixia/age

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  # each arch is built and tested natively on its own runner instead of under QEMU
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [shellcheck]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^ARG AGE_VERSION=//p' Dockerfile)
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?$' || [ "${GITHUB_REF_NAME%%-*}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} must be ${version} or ${version}-<suffix>"
            exit 1
          fi
      - name: Build
        run: |
          docker buildx create --use
          docker buildx build --load --tag osixia/age:test --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" .
      - name: Run tests
        run: tests/run.sh osixia/age:test
      # on tags, the tested image is pushed without a tag: the publish job tags all arches together
      - name: Push by digest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          ARCH: ${{ matrix.arch }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin
          docker buildx build --metadata-file metadata.json \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" .
          mkdir digests
          jq -r '."containerimage.digest"' metadata.json > "digests/${ARCH}"
          grep -Eq '^sha256:[0-9a-f]{64}$' "digests/${ARCH}"
      - name: Upload digest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests/
          merge-multiple: true
      - name: Read release notes
        run: |
          awk -v header="## [${GITHUB_REF_NAME}]" '
            index($0, "## [") == 1 { found = index($0, header) == 1; next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"
            exit 1
          fi
      # only x.y.z and x.y.z-n tags that are the highest version move latest, x.y and x
      - name: Compute tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=("${GITHUB_REF_NAME}")
          release='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'
          highest=$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name' | grep -E "${release}" | sort -V | tail -n 1)
          if [ "${highest}" = "${GITHUB_REF_NAME}" ]; then
            IFS=. read -r major minor _ <<<"${GITHUB_REF_NAME}"
            tags+=(latest "${major}.${minor}" "${major}")
          fi
          printf '%s\n' "${tags[@]}" > tags.txt
      - name: Publish multi-arch image
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin
          args=()
          while IFS= read -r tag; do
            args+=(--tag "${IMAGE}:${tag}")
          done < tags.txt
          for digest in digests/*; do
            args+=("${IMAGE}@$(cat "${digest}")")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Sign image and generate SBOM
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{ json .Manifest.Digest }}' | tr -d '"')
          ref="${IMAGE}@${digest}"
          cosign sign --yes --registry-referrers-mode=oci-1-1 "${ref}"
          syft "${ref}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${ref}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            prerelease=(--prerelease)
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md "${prerelease[@]}"
